<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>TaskNest Dashboard</h1>
    <p class="subtitle">Your team's task overview at a glance.</p>
  </div>

  <div class="stats-grid">
    <mat-card class="stat-card">
      <mat-card-content>
        <div class="stat-number">{{ total }}</div>
        <div class="stat-label">Total Tasks</div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card done">
      <mat-card-content>
        <div class="stat-number">{{ done }}</div>
        <div class="stat-label">Completed</div>
      </mat-card-content>
    </mat-card>

<mat-card class="stat-card todo">
      <mat-card-content>
        <div class="stat-number">{{ todo }}</div>
        <div class="stat-label">To Do</div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card overdue">
      <mat-card-content>
        <div class="stat-number">{{ overdue }}</div>
        <div class="stat-label">Overdue</div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="dashboard-actions">
    <a mat-raised-button color="primary" routerLink="/tasks">View All Tasks</a>
    <a mat-stroked-button color="primary" routerLink="/tasks/create">+ New Task</a>
  </div>
</div>
