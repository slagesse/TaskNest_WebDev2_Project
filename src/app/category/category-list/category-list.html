<div class="category-list-container">
  <h1>Categories</h1>

  <mat-card class="create-card">
    <mat-card-content>
      <h2>New Category</h2>
      <form [formGroup]="form" (ngSubmit)="onCreate()" class="create-form">
        <mat-form-field appearance="outline" class="field-title">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" placeholder="Category name" />
          <mat-error>Title is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-description">
          <mat-label>Description</mat-label>
          <input matInput formControlName="description" placeholder="Optional description" />
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
          Add Category
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <div class="category-cards">
    @for (cat of categories; track cat.id) {
      <mat-card>
        <mat-card-content>
          <div class="category-card-meta">
            <strong>{{ cat.title }}</strong>
            @if (cat.isDefault) {
              <span class="default-badge">Default</span>
            }
          </div>
          @if (cat.description) {
            <p class="category-description">{{ cat.description }}</p>
          }
        </mat-card-content>
        <mat-card-actions>
          <button
            mat-button
            color="warn"
            [disabled]="cat.isDefault"
            (click)="onDelete(cat.id)"
          >
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>

  @if (categories.length === 0) {
    <p class="empty-state">No categories yet.</p>
  }
</div>
